name: Sync from Upstream

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync with upstream
        run: |
          git config user.email "sync@github.com"
          git config user.name "GitHub Sync"
          git remote add upstream https://${{ secrets.UPSTREAM_TOKEN }}@github.com/parvezmohammed2024-bit/dashoutdoors.git
          git fetch upstream
          git merge upstream/main --allow-unrelated-histories -m "Auto sync from upstream" || true
          git push origin main
